      #     PAYLOAD=$(cat <<EOF
      #     {
      #       "@type": "MessageCard",
      #       "@context": "http://schema.org/extensions",
      #       "themeColor": "${COLOR}",
      #       "summary": "${TITLE}",
      #       "sections": [{
      #         "activityTitle": "${TITLE}",
      #         "facts": [
      #           { "name": "Proyecto", "value": "backendvg (APPSW.war)" },
      #           { "name": "Ambiente", "value": "${{ inputs.environment || 'production' }}" },
      #           { "name": "Rama", "value": "${{ github.ref_name }}" },
      #           { "name": "Commit", "value": "${{ needs.build.outputs.short_sha }}" },
      #           { "name": "Autor", "value": "${{ github.actor }}" },
